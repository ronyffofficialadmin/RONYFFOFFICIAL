<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RONY FF — Video URL Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#0b1020;color:#fff;margin:0;padding:20px}
.box{max-width:520px;margin:auto;background:#151c32;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0006}
h1{font-size:22px;margin-top:0}.muted{color:#aeb7cf;font-size:14px}
input,button{width:100%;box-sizing:border-box;margin-top:10px;padding:14px;border-radius:12px;border:1px solid #39435f;font-size:15px}
input{background:#0e1425;color:#fff}button{background:#2563eb;color:#fff;border:0;font-weight:700}
button:disabled{opacity:.5}.url{margin-top:15px;background:#0b1222;padding:12px;border-radius:12px;word-break:break-all;color:#8be9fd}
video{width:100%;margin-top:15px;border-radius:12px;display:none}.ok{color:#67e8a5}.err{color:#ff8b8b}
.filebox{margin-top:10px;padding:14px;border:1px dashed #53617f;border-radius:12px;background:#0e1425}
#file{padding:0;border:0;background:transparent}
</style>
</head>
<body>
<div class="box">
<h1>🎬 RONY FF — Video URL Generator</h1>
<div class="muted">वीडियो चुनो → Upload करो → नीचे मिलने वाला URL अपने Admin Panel के Video URL में डालो.</div>

<input id="email" type="email" placeholder="Admin email" autocomplete="username">
<input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
<button id="loginBtn">LOGIN</button>
<div id="loginStatus" class="muted"></div>

<div class="filebox">
<input id="file" type="file" accept="video/*" disabled>
</div>
<button id="uploadBtn" disabled>UPLOAD VIDEO & GET URL</button>

<div id="status" class="muted"></div>
<video id="preview" controls playsinline></video>

<div id="result" style="display:none">
<div class="muted">आपका Video URL:</div>
<div id="url" class="url"></div>
<button id="copyBtn">COPY URL</button>
</div>
</div>

<script>
const SUPABASE_URL='https://dgknhptbbozshyfiyobo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_NEHCtr3Y0o8FctOz5Jm59A_P4GhFAQd';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const BUCKET='product-videos';
const $=id=>document.getElementById(id);
const setStatus=(msg,ok=false)=>{$('status').textContent=msg;$('status').className=ok?'ok':'muted'};

$('loginBtn').onclick=async()=>{
 const email=$('email').value.trim(), password=$('password').value;
 if(!email||!password){$('loginStatus').textContent='Email और password डालो.';return}
 $('loginBtn').disabled=true;$('loginStatus').textContent='Login हो रहा है...';
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){$('loginStatus').textContent='Login error: '+error.message;$('loginBtn').disabled=false;return}
 $('loginStatus').textContent='✅ Login सफल';
 $('file').disabled=false;$('uploadBtn').disabled=false;$('email').disabled=true;$('password').disabled=true;
};

$('file').addEventListener('change',function(){
 const f=this.files && this.files.length ? this.files[0] : null;
 if(!f){setStatus('वीडियो select नहीं हुआ. Choose File फिर से दबाओ.');return}
 if(!f.type || !f.type.startsWith('video/')){setStatus('सिर्फ video file चुनो.');this.value='';return}
 if(f.size>200*1024*1024){setStatus('Video 200 MB से छोटा रखो.');this.value='';return}
 try{
   $('preview').src=URL.createObjectURL(f);
   $('preview').style.display='block';
 }catch(e){}
 setStatus('✅ Video select हो गया: '+f.name,true);
});

$('uploadBtn').onclick=async()=>{
 const f=$('file').files && $('file').files.length ? $('file').files[0] : null;
 if(!f)return setStatus('पहले video चुनो.');
 const {data:{user}}=await db.auth.getUser();
 if(!user)return setStatus('Login session नहीं मिला. फिर से login करो.');
 $('uploadBtn').disabled=true;setStatus('Upload हो रहा है, थोड़ा इंतज़ार करो...');
 const ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
 const safe=(f.name.replace(/\.[^/.]+$/,'').replace(/[^a-zA-Z0-9_-]/g,'_')||'video').slice(0,60);
 const path=user.id+'/'+Date.now()+'-'+safe+'.'+ext;
 const {error}=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type||'video/mp4',upsert:false,cacheControl:'3600'});
 if(error){setStatus('Upload failed: '+error.message);$('uploadBtn').disabled=false;return}
 const {data}=db.storage.from(BUCKET).getPublicUrl(path);
 $('url').textContent=data.publicUrl;$('result').style.display='block';
 setStatus('✅ Upload पूरा. यह URL Admin Panel में डालो.',true);
 $('uploadBtn').disabled=false;
};

$('copyBtn').onclick=async()=>{
 const text=$('url').textContent;
 try{await navigator.clipboard.writeText(text)}catch(e){
   const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
 }
 $('copyBtn').textContent='COPIED ✅';setTimeout(()=>$('copyBtn').textContent='COPY URL',1500);
};
</script>
</body>
</html>
